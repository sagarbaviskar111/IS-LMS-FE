<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#047857" />
    <title>You are offline - InstituteSathi</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #0f172a; }
      .card { max-width: 380px; width: 100%; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08); }
      img { width: 64px; height: 64px; border-radius: 14px; }
      h1 { font-size: 1.25rem; margin: 16px 0 8px; }
      p { margin: 0 0 20px; color: #475569; line-height: 1.5; font-size: 0.95rem; }
      button { padding: 12px 22px; border: 0; border-radius: 10px; background: #047857; color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="" />
      <h1>You are offline</h1>
      <p>InstituteSathi needs an internet connection. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
